name: Heart Disease MLOps Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  mlops-pipeline:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        python -m pytest tests/

    - name: Train Model
      run: |
        python src/train.py

    - name: Verify Model Artifacts
      run: |
        test -f models/final_model.pkl
        test -f models/scaler.pkl